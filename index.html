<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bitovi Avatar Generator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red:   #F3684C;
      --green: #10312F;
      --white: #FFFFFF;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--green);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      width: 100%;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      padding: 18px 40px;
      display: flex;
      align-items: center;
    }
    header .tagline { font-size: 13px; color: rgba(255,255,255,0.35); margin-left: auto; }

    main {
      width: 100%;
      max-width: 480px;
      padding: 48px 24px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    h1 { font-size: 26px; font-weight: 700; text-align: center; }
    h1 span { color: var(--red); }
    .subtitle { font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 12px; }

    /* Upload */
    .upload-zone {
      width: 100%;
      border: 2px dashed rgba(255,255,255,0.16);
      border-radius: 14px;
      padding: 44px 24px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      cursor: pointer; text-align: center;
      transition: border-color .2s, background .2s;
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--red); background: rgba(243,104,76,0.05);
    }
    .upload-zone input { display: none; }
    .upload-icon {
      width: 46px; height: 46px; border-radius: 50%;
      background: rgba(243,104,76,0.14);
      display: flex; align-items: center; justify-content: center;
    }
    .upload-zone p { font-size: 14px; color: rgba(255,255,255,0.45); }
    .upload-zone strong { color: var(--white); }
    .upload-zone .hint { font-size: 12px; color: rgba(255,255,255,0.25); }

    /* Editor */
    .editor { display: none; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
    .editor.visible { display: flex; }

    /* Canvas — displayed at 360px, rendered at 600px */
    canvas#preview {
      width: 360px; height: 360px;
      border-radius: 50%;
      display: block;
      cursor: grab;
      filter: drop-shadow(0 16px 40px rgba(0,0,0,0.5));
      touch-action: none;
    }
    canvas#preview.dragging { cursor: grabbing; }

    .hint-drag {
      font-size: 11px; color: rgba(255,255,255,0.3);
      display: flex; align-items: center; gap: 5px; margin-top: -8px;
    }

    /* Controls row */
    .controls { width: 100%; display: flex; flex-direction: column; gap: 14px; }
    .ctrl-row { display: flex; align-items: center; gap: 10px; }
    .ctrl-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .1em; color: rgba(255,255,255,0.3); width: 36px;
    }
    .zoom-icon { font-size: 16px; color: rgba(255,255,255,0.35); user-select: none; }

    input[type=range] {
      -webkit-appearance: none; flex: 1; height: 4px;
      border-radius: 2px; background: rgba(255,255,255,0.1); outline: none; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
      background: var(--red); box-shadow: 0 2px 6px rgba(0,0,0,0.35); cursor: pointer;
    }
    input[type=range]::-moz-range-thumb {
      width: 18px; height: 18px; border: none; border-radius: 50%;
      background: var(--red); cursor: pointer;
    }

    /* Buttons */
    .action-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 4px; }
    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer; border: none; transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--red); color: var(--white); }
    .btn-primary:hover { opacity: .88; }
    .btn-secondary {
      background: rgba(255,255,255,0.07); color: var(--white);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.11); }

    footer { margin-top: auto; padding: 24px; font-size: 12px; color: rgba(255,255,255,0.15); }
  </style>
</head>
<body>

<header>
  <svg width="88" height="27" viewBox="0 0 109 34" fill="none">
    <path fill="white" fill-rule="evenodd" d="M26.27 0C23.91 0 21.99 1.99 21.99 4.43s1.92 4.42 4.28 4.42 4.28-1.98 4.28-4.42S28.63 0 26.27 0zm78.44 0c-2.36 0-4.28 1.99-4.28 4.43s1.92 4.42 4.28 4.42 4.28-1.98 4.28-4.42S107.07 0 104.71 0zm-78.44 1.16c1.76 0 3.17 1.46 3.17 3.27s-1.41 3.27-3.17 3.27-3.17-1.46-3.17-3.27 1.41-3.27 3.17-3.27zM0 10.02v23.31h12.52c1.42 0 2.67-.15 3.75-.46 1.1-.33 2.01-.79 2.74-1.37.73-.58 1.28-1.25 1.64-2.03.37-.8.55-1.66.55-2.59v-.07c0-1.6-.43-2.83-1.29-3.7-.86-.86-2.02-1.52-3.48-1.96 1.23-.44 2.2-1.08 2.93-1.93.73-.87 1.1-2 1.1-3.4v-.06c0-.8-.13-1.5-.39-2.1-.26-.6-.6-1.11-1.01-1.53-.67-.69-1.52-1.2-2.55-1.56-1.01-.36-2.3-.54-3.87-.54H0zm22.5 23.31h7.55V10.02H22.5v23.31zm8.98-23.31v6.59h6.65v16.72h7.56V16.61h6.64v-6.59H31.48zm42.72 0l9.17 23.48h7.22l9.17-23.48h-8.32l-4.39 13.08-4.39-13.08h-8.46zm27.74 23.31h7.55V10.02h-7.55v23.31zM7.36 15.92h3.27c1.61 0 2.42.53 2.42 1.59v.06c0 1.07-.8 1.61-2.39 1.61H7.36v-3.26zm56.91-6.41c-1.74 0-3.36.32-4.87.96-1.5.62-2.82 1.5-3.94 2.61-1.09 1.09-1.96 2.37-2.6 3.86-.63 1.46-.94 3.04-.94 4.73v.06c0 1.69.31 3.28.94 4.76.62 1.47 1.48 2.75 2.58 3.84 1.12 1.09 2.42 1.94 3.9 2.56 1.51.62 3.14.94 4.88.94 1.74 0 3.37-.32 4.88-.94 1.5-.64 2.8-1.51 3.9-2.6 1.12-1.11 1.98-2.39 2.6-3.86.64-1.49.97-3.07.97-4.76v-.07c0-1.69-.31-3.26-.94-4.72-.62-1.49-1.5-2.78-2.62-3.87-1.1-1.09-2.4-1.94-3.9-2.56-1.49-.62-3.11-.94-4.85-.94zm-.06 6.9c.73 0 1.39.14 1.97.43.58.29 1.07.67 1.47 1.16.41.49.72 1.06.93 1.71.24.62.36 1.27.36 1.97v.06c0 .69-.11 1.34-.32 1.96-.22.62-.52 1.17-.93 1.66-.41.47-.91.84-1.49 1.13-.58.29-1.22.43-1.93.43-.73 0-1.39-.14-1.97-.43-.58-.29-1.08-.67-1.49-1.16-.41-.49-.72-1.07-.94-1.69-.22-.64-.33-1.3-.33-1.97v-.07c0-.69.11-1.34.33-1.96.22-.62.53-1.17.94-1.66.41-.49.91-.84 1.49-1.13.58-.29 1.22-.43 1.91-.43zM7.36 23.97h3.81c.82 0 1.44.16 1.85.47.41.31.61.72.61 1.23v.06c0 .51-.21.93-.64 1.24-.41.31-1.02.47-1.84.47H7.36v-3.47z"/>
  </svg>
  <span class="tagline">Avatar Generator</span>
</header>

<main>
  <h1>Your <span>Bitovi</span> Avatar</h1>
  <p class="subtitle">Upload, drag to position, zoom to fit.</p>

  <label class="upload-zone" id="dropzone">
    <input type="file" id="fileInput" accept="image/*" />
    <div class="upload-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M12 16V8M12 8L9 11M12 8L15 11" stroke="#F3684C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M3 16.5V18.75C3 19.9926 4.00736 21 5.25 21H18.75C19.9926 21 21 19.9926 21 18.75V16.5" stroke="#F3684C" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <p><strong>Click to upload</strong> or drag & drop</p>
    <p class="hint">PNG · JPG · WEBP · Max 20 MB</p>
  </label>

  <div class="editor" id="editor">
    <canvas id="preview" width="600" height="600"></canvas>
    <p class="hint-drag">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M3 12h18M12 3v18" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/></svg>
      Drag to reposition
    </p>

    <div class="controls">
      <div class="ctrl-row">
        <span class="zoom-icon">⊖</span>
        <input type="range" id="zoomSlider" min="100" max="300" value="100" step="1" />
        <span class="zoom-icon">⊕</span>
      </div>
    </div>

    <div class="action-row">
      <button class="btn btn-secondary" id="resetBtn">Change photo</button>
      <button class="btn btn-primary" id="downloadBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <path d="M12 16L7 11M12 16L17 11M12 16V4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3 18H21" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Download
      </button>
    </div>
  </div>
</main>

<footer>Bitovi · Internal tool · Brand guidelines v1.1</footer>

<script>
const SIZE   = 600;
const R      = SIZE / 2;   // circle radius
const CX     = R, CY = R;  // circle center
const RED    = '#F3684C';
const GREEN  = '#10312F';
const WHITE  = '#FFFFFF';

// Diagonal endpoints — computed to land exactly on the circle boundary
// Left point: at y = 72% of SIZE, x solved from circle equation
const DIAG_LY = SIZE * 0.72;
const DIAG_RY = SIZE * 0.80;
const DIAG_LX = CX - Math.sqrt(Math.max(0, R * R - (DIAG_LY - CY) ** 2));
const DIAG_RX = CX + Math.sqrt(Math.max(0, R * R - (DIAG_RY - CY) ** 2));

const LOGO_W = 109, LOGO_H = 34;
const LOGO_PATH = new Path2D('M26.27 0C23.91 0 21.99 1.99 21.99 4.43s1.92 4.42 4.28 4.42 4.28-1.98 4.28-4.42S28.63 0 26.27 0zm78.44 0c-2.36 0-4.28 1.99-4.28 4.43s1.92 4.42 4.28 4.42 4.28-1.98 4.28-4.42S107.07 0 104.71 0zm-78.44 1.16c1.76 0 3.17 1.46 3.17 3.27s-1.41 3.27-3.17 3.27-3.17-1.46-3.17-3.27 1.41-3.27 3.17-3.27zM0 10.02v23.31h12.52c1.42 0 2.67-.15 3.75-.46 1.1-.33 2.01-.79 2.74-1.37.73-.58 1.28-1.25 1.64-2.03.37-.8.55-1.66.55-2.59v-.07c0-1.6-.43-2.83-1.29-3.7-.86-.86-2.02-1.52-3.48-1.96 1.23-.44 2.2-1.08 2.93-1.93.73-.87 1.1-2 1.1-3.4v-.06c0-.8-.13-1.5-.39-2.1-.26-.6-.6-1.11-1.01-1.53-.67-.69-1.52-1.2-2.55-1.56-1.01-.36-2.3-.54-3.87-.54H0zm22.5 23.31h7.55V10.02H22.5v23.31zm8.98-23.31v6.59h6.65v16.72h7.56V16.61h6.64v-6.59H31.48zm42.72 0l9.17 23.48h7.22l9.17-23.48h-8.32l-4.39 13.08-4.39-13.08h-8.46zm27.74 23.31h7.55V10.02h-7.55v23.31zM7.36 15.92h3.27c1.61 0 2.42.53 2.42 1.59v.06c0 1.07-.8 1.61-2.39 1.61H7.36v-3.26zm56.91-6.41c-1.74 0-3.36.32-4.87.96-1.5.62-2.82 1.5-3.94 2.61-1.09 1.09-1.96 2.37-2.6 3.86-.63 1.46-.94 3.04-.94 4.73v.06c0 1.69.31 3.28.94 4.76.62 1.47 1.48 2.75 2.58 3.84 1.12 1.09 2.42 1.94 3.9 2.56 1.51.62 3.14.94 4.88.94 1.74 0 3.37-.32 4.88-.94 1.5-.64 2.8-1.51 3.9-2.6 1.12-1.11 1.98-2.39 2.6-3.86.64-1.49.97-3.07.97-4.76v-.07c0-1.69-.31-3.26-.94-4.72-.62-1.49-1.5-2.78-2.62-3.87-1.1-1.09-2.4-1.94-3.9-2.56-1.49-.62-3.11-.94-4.85-.94zm-.06 6.9c.73 0 1.39.14 1.97.43.58.29 1.07.67 1.47 1.16.41.49.72 1.06.93 1.71.24.62.36 1.27.36 1.97v.06c0 .69-.11 1.34-.32 1.96-.22.62-.52 1.17-.93 1.66-.41.47-.91.84-1.49 1.13-.58.29-1.22.43-1.93.43-.73 0-1.39-.14-1.97-.43-.58-.29-1.08-.67-1.49-1.16-.41-.49-.72-1.07-.94-1.69-.22-.64-.33-1.3-.33-1.97v-.07c0-.69.11-1.34.33-1.96.22-.62.53-1.17.94-1.66.41-.49.91-.84 1.49-1.13.58-.29 1.22-.43 1.91-.43zM7.36 23.97h3.81c.82 0 1.44.16 1.85.47.41.31.61.72.61 1.23v.06c0 .51-.21.93-.64 1.24-.41.31-1.02.47-1.84.47H7.36v-3.47z');

// State
let img = null, zoom = 1, panX = 0, panY = 0;
let drag = false, dragStartX = 0, dragStartY = 0, panStartX = 0, panStartY = 0;

const canvas      = document.getElementById('preview');
const ctx         = canvas.getContext('2d');
const dropzone    = document.getElementById('dropzone');
const fileInput   = document.getElementById('fileInput');
const editor      = document.getElementById('editor');
const zoomSlider  = document.getElementById('zoomSlider');
const downloadBtn = document.getElementById('downloadBtn');
const resetBtn    = document.getElementById('resetBtn');

// ── File load ──────────────────────────────────────────────────────────────
fileInput.addEventListener('change', e => loadFile(e.target.files[0]));
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag-over'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
dropzone.addEventListener('drop', e => { e.preventDefault(); dropzone.classList.remove('drag-over'); loadFile(e.dataTransfer.files[0]); });

function loadFile(file) {
  if (!file?.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const i = new Image();
    i.onload = () => { img = i; zoom = 1; panX = 0; panY = 0; zoomSlider.value = 100; dropzone.style.display = 'none'; editor.classList.add('visible'); render(); };
    i.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

resetBtn.addEventListener('click', () => { img = null; fileInput.value = ''; editor.classList.remove('visible'); dropzone.style.display = ''; });

// ── Zoom ───────────────────────────────────────────────────────────────────
zoomSlider.addEventListener('input', () => { zoom = zoomSlider.value / 100; clampPan(); render(); });

// ── Drag to pan (mouse) ────────────────────────────────────────────────────
canvas.addEventListener('mousedown', e => { if (!img) return; drag = true; canvas.classList.add('dragging'); dragStartX = e.clientX; dragStartY = e.clientY; panStartX = panX; panStartY = panY; });
window.addEventListener('mousemove', e => { if (!drag) return; const scale = SIZE / 360; panX = panStartX + (e.clientX - dragStartX) * scale; panY = panStartY + (e.clientY - dragStartY) * scale; clampPan(); render(); });
window.addEventListener('mouseup', () => { drag = false; canvas.classList.remove('dragging'); });

// ── Drag to pan (touch) ────────────────────────────────────────────────────
canvas.addEventListener('touchstart', e => { if (!img) return; e.preventDefault(); drag = true; dragStartX = e.touches[0].clientX; dragStartY = e.touches[0].clientY; panStartX = panX; panStartY = panY; }, { passive: false });
window.addEventListener('touchmove', e => { if (!drag) return; const scale = SIZE / 360; panX = panStartX + (e.touches[0].clientX - dragStartX) * scale; panY = panStartY + (e.touches[0].clientY - dragStartY) * scale; clampPan(); render(); }, { passive: true });
window.addEventListener('touchend', () => { drag = false; });

function clampPan() {
  if (!img) return;
  const aspect = img.naturalWidth / img.naturalHeight;
  let dw, dh;
  if (aspect >= 1) { dh = SIZE * zoom; dw = dh * aspect; }
  else             { dw = SIZE * zoom; dh = dw / aspect; }
  const maxPanX = Math.max(0, (dw - SIZE) / 2);
  const maxPanY = Math.max(0, (dh - SIZE) / 2);
  panX = Math.max(-maxPanX, Math.min(maxPanX, panX));
  panY = Math.max(-maxPanY, Math.min(maxPanY, panY));
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  if (!img) return;
  ctx.clearRect(0, 0, SIZE, SIZE);

  // 1. Clip everything to a perfect circle (transparent outside = safe on any platform)
  ctx.save();
  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, Math.PI * 2);
  ctx.clip();

  // 2. Photo (cover + zoom + pan)
  const aspect = img.naturalWidth / img.naturalHeight;
  let dw, dh;
  if (aspect >= 1) { dh = SIZE * zoom; dw = dh * aspect; }
  else             { dw = SIZE * zoom; dh = dw / aspect; }
  const dx = (SIZE - dw) / 2 + panX;
  const dy = (SIZE - dh) / 2 + panY;
  ctx.drawImage(img, dx, dy, dw, dh);

  // 3. Diagonal overlay with fade — polygon clipped to circle
  const fadeH = 100;
  const fadeTop = Math.min(DIAG_LY, DIAG_RY) - fadeH * 0.4;
  const fadeBot = Math.max(DIAG_LY, DIAG_RY) + fadeH;
  const grad = ctx.createLinearGradient(0, fadeTop, 0, fadeBot);
  grad.addColorStop(0,    'rgba(16,49,47,0)');
  grad.addColorStop(0.4,  'rgba(16,49,47,0.5)');
  grad.addColorStop(1,    'rgba(16,49,47,0.96)');

  ctx.beginPath();
  ctx.moveTo(DIAG_LX, DIAG_LY);
  ctx.lineTo(DIAG_RX, DIAG_RY);
  // Arc along the bottom of the circle to close the shape
  const angleR = Math.atan2(DIAG_RY - CY, DIAG_RX - CX);
  const angleL = Math.atan2(DIAG_LY - CY, DIAG_LX - CX);
  ctx.arc(CX, CY, R, angleR, angleL, false); // clockwise bottom arc
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // 4. Red diagonal accent line
  ctx.beginPath();
  ctx.moveTo(DIAG_LX, DIAG_LY);
  ctx.lineTo(DIAG_RX, DIAG_RY);
  ctx.strokeStyle = RED;
  ctx.lineWidth = 4;
  ctx.stroke();

  // 5. Bitovi logo — centered horizontally in the green zone (safe inside circle)
  const logoCenterY = DIAG_LY + (SIZE - DIAG_LY) * 0.52;
  const logoTargetH = 26;
  const logoTargetW = LOGO_W * (logoTargetH / LOGO_H);
  const logoX = CX - logoTargetW / 2;
  const logoY = logoCenterY - logoTargetH / 2;

  ctx.save();
  ctx.translate(logoX, logoY);
  ctx.scale(logoTargetW / LOGO_W, logoTargetH / LOGO_H);
  ctx.fillStyle = WHITE;
  ctx.fill(LOGO_PATH);
  ctx.restore();

  ctx.restore();
}

// ── Download ───────────────────────────────────────────────────────────────
downloadBtn.addEventListener('click', () => {
  const a = document.createElement('a');
  a.download = 'bitovi-avatar.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
});

// ── Helpers ─────────────────────────────────────────────────────────────────
function roundedRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
</script>
</body>
